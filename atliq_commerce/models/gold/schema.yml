version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: dim_product
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: dim_date
    columns:
      - name: date_day
        data_tests:
          - not_null
          - unique

  - name: fact_sales
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fact_web_sessions
    columns:
      - name: session_id
        data_tests:
          - not_null
