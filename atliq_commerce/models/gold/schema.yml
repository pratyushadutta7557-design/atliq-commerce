
version: 2

models:
  - name: dim_customer
    description: "Customer dimension excluding test accounts"
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        data_tests:
          - unique
          - not_null

  - name: dim_date
    description: "Calendar date dimension"
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: dim_product
    description: "Product dimension with supplier cost and unit margin"
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: fact_sales
    description: "Sales fact table at order item grain"
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fact_web_sessions
    description: "Web session fact table at session grain"
    columns:
      - name: session_id
        data_tests:
          - unique
          - not_null
      - name: session_start
        data_tests:
          - not_null
      - name: session_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
